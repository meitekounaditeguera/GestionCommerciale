<div class="login-shell">

  <section class="brand-pane" aria-hidden="true">
    <div class="brand-pane__content">
      <div class="brand-mark">GC</div>

      <h1 class="brand-title">Gestion Commerciale</h1>
      <p class="brand-tagline">Clients, produits, commandes et stock&nbsp;: au même endroit.</p>

      <ul class="brand-modules">
        <li>Clients</li>
        <li>Produits</li>
        <li>Commandes</li>
        <li>Stock</li>
        <li>Fournisseurs</li>
      </ul>
    </div>
  </section>

  <section class="form-pane">
    <div class="form-pane__content">
      <header class="form-header">
        <h2>Connexion</h2>
        <p>Accédez à votre espace de gestion.</p>
      </header>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
        <div class="field-group">
          <label for="username">Identifiant</label>
          <div class="input-with-icon">
            <i class="bi bi-person"></i>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              [(ngModel)]="username"
              required
            />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Mot de passe</label>
          <div class="input-with-icon">
            <i class="bi bi-lock"></i>
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              [(ngModel)]="password"
              required
            />
            <button
              type="button"
              class="toggle-visibility"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        @if (errorMessage) {
          <div class="form-alert" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ errorMessage }}</span>
          </div>
        }

        <button class="submit-btn" type="submit" [disabled]="isLoading">
          @if (!isLoading) {
            <span>Se connecter</span>
          } @else {
            <span class="submit-btn__loading">
              <span class="spinner" aria-hidden="true"></span>
              Connexion…
            </span>
          }
        </button>
      </form>

      <p class="form-footer">Besoin d'aide&nbsp;? Contactez votre administrateur.</p>
    </div>
  </section>

</div>
