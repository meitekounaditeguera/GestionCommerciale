spring.application.name=backend

# PostgreSQL
# Identifiants lus depuis les variables d'environnement DB_USERNAME / DB_PASSWORD
# (jamais commités en clair). Voir le README pour la configuration locale.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/gestion_commerciale
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Serveur
server.port=8080

# Actuator : expose /actuator/health comme vérification d'état de l'application
management.endpoint.health.show-details=always