spring.application.name=backend

# PostgreSQL
# Identifiants lus depuis les variables d'environnement DB_USERNAME / DB_PASSWORD
# (jamais commités en clair). Voir le README pour la configuration locale.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/gestion_commerciale
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Serveur
server.port=8080

# Actuator : expose /actuator/health comme vérification d'état de l'application
management.endpoint.health.show-details=always

# Email (alerte stock quotidienne)
# Identifiants lus depuis l'environnement, jamais commités en clair (même principe que
# DB_USERNAME/DB_PASSWORD). Contrairement à la base de données, l'application doit pouvoir
# démarrer même si l'envoi d'email n'est pas configuré sur ce poste : des valeurs par défaut
# neutres sont donc fournies plutôt que de bloquer le démarrage.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Désactive l'indicateur de santé mail d'Actuator : /actuator/health ne doit pas dépendre
# de la disponibilité du serveur SMTP, qui est une fonctionnalité secondaire (alerte stock)
# et pas un composant critique du fonctionnement de l'application.
management.health.mail.enabled=false

# Destinataire de l'alerte stock.
alerte.stock.destinataire=${ALERTE_STOCK_DESTINATAIRE:}

# Cron du job d'alerte stock (par défaut : tous les jours à 8h00).
alerte.stock.cron=${ALERTE_STOCK_CRON:0 0 8 * * *}

# Archivage des factures PDF (générées côté serveur à la création de chaque commande).
# Stockage sur système de fichiers plutôt qu'en base (colonne/table bytea) : plus simple à
# faire évoluer (fichiers consultables/sauvegardables directement, pas de gonflement de la
# table "commandes", aucune contrainte de taille de colonne) au prix d'un couplage au disque
# du serveur applicatif — à revoir (S3/MinIO, ou stockage bytea dédié) si l'application doit
# un jour tourner sur plusieurs instances sans disque partagé.
# Chemin relatif au répertoire de lancement par défaut ; ALERTE_STOCK_DESTINATAIRE montre le
# même principe : remplaçable par un chemin absolu via la variable d'environnement.
facture.stockage.dossier=${FACTURE_STOCKAGE_DOSSIER:./factures}