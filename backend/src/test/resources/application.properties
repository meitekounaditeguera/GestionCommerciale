spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.secret=gestion-commerciale-jwt-secret-key-2026-application
jwt.expiration-ms=3600000

# Email (alerte stock) : valeurs neutres pour que le contexte Spring démarre en test sans
# dépendre d'un vrai serveur SMTP ni de variables d'environnement.
spring.mail.host=localhost
spring.mail.port=587
management.health.mail.enabled=false
alerte.stock.destinataire=test@example.com
alerte.stock.cron=0 0 8 * * *

# Factures PDF : dossier dédié aux tests, distinct de celui utilisé en développement.
facture.stockage.dossier=./target/factures-test
