name: CI Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Les tests utilisent la base H2 en mémoire de src/test/resources/application.properties :
      # pas de service PostgreSQL ni de variable SPRING_DATASOURCE_* (elles remplaceraient l'URL
      # H2 par une URL PostgreSQL alors que le driver de test reste H2).
      - name: Run tests
        working-directory: backend
        run: ./mvnw test

      - name: Build application
        working-directory: backend
        run: ./mvnw package -DskipTests
